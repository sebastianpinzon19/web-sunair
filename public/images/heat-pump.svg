<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#e6f2ff"/>
  
  <!-- Unit Body - Rounded and Modern -->
  <rect x="75" y="50" width="250" height="220" fill="#a8a8a8" rx="12"/>
  
  <!-- Top Accent Bar -->
  <rect x="80" y="55" width="240" height="35" fill="#0099CC" rx="8"/>
  <text x="200" y="80" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Heat Pump</text>
  
  <!-- Main Housing Section -->
  <rect x="85" y="95" width="230" height="160" fill="#888888" rx="8"/>
  
  <!-- Compressor Unit Visualization -->
  <ellipse cx="200" cy="140" rx="70" ry="55" fill="#666666"/>
  
  <!-- Cooling/Heating Indicator Lines -->
  <line x1="130" y1="110" x2="270" y2="110" stroke="#0099CC" stroke-width="3"/>
  <line x1="130" y1="170" x2="270" y2="170" stroke="#FF6B35" stroke-width="3"/>
  
  <!-- Fan Motor Area -->
  <circle cx="200" cy="140" r="35" fill="#444444"/>
  
  <!-- Fan Blades (Visible) -->
  <ellipse cx="200" cy="110" rx="30" ry="10" fill="#555555"/>
  <ellipse cx="200" cy="170" rx="30" ry="10" fill="#555555"/>
  
  <!-- Center Emblem -->
  <circle cx="200" cy="140" r="15" fill="#0099CC"/>
  <text x="200" y="145" font-size="16" font-weight="bold" fill="white" text-anchor="middle">⚙️</text>
  
  <!-- Service Access Panel -->
  <rect x="100" y="220" width="200" height="20" fill="#777777" stroke="#555555" stroke-width="1" rx="2"/>
  <text x="200" y="233" font-size="11" fill="#cccccc" text-anchor="middle" font-family="Arial">R-32 Certified</text>
  
  <!-- Corner Rivets -->
  <circle cx="90" cy="60" r="3" fill="#333333"/>
  <circle cx="310" cy="60" r="3" fill="#333333"/>
  <circle cx="90" cy="250" r="3" fill="#333333"/>
  <circle cx="310" cy="250" r="3" fill="#333333"/>
</svg>