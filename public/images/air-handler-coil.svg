<svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="500" fill="#f0f0f0"/>
  
  <!-- Shadow -->
  <ellipse cx="150" cy="485" rx="120" ry="15" fill="#00000015"/>
  
  <!-- Main Unit Body (Dual Section) -->
  <!-- Upper Section -->
  <rect x="30" y="40" width="240" height="200" fill="#a8a8a8" rx="10"/>
  
  <!-- Divider Line -->
  <line x1="35" y1="250" x2="265" y2="250" stroke="#777777" stroke-width="3"/>
  
  <!-- Lower Section -->
  <rect x="30" y="255" width="240" height="195" fill="#9a9a9a" rx="10"/>
  
  <!-- Top Panel Section - Logo Area -->
  <g id="logo">
    <rect x="50" y="60" width="200" height="50" fill="#e8e8e8" rx="4"/>
    <text x="150" y="95" font-size="24" font-weight="bold" fill="#0099CC" text-anchor="middle" font-family="Arial">SUN AIR</text>
  </g>
  
  <!-- Upper Housing Content -->
  <rect x="40" y="130" width="220" height="100" fill="#8a8a8a" stroke="#666666" stroke-width="1" rx="4"/>
  
  <!-- Vertical Ribs - Upper Section -->
  <line x1="45" y1="135" x2="45" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="62" y1="135" x2="62" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="79" y1="135" x2="79" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="96" y1="135" x2="96" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="113" y1="135" x2="113" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="130" y1="135" x2="130" y2="220" stroke="#888888" stroke-width="2"/>
  <line x1="147" y1="135" x2="147" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="164" y1="135" x2="164" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="181" y1="135" x2="181" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="198" y1="135" x2="198" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="215" y1="135" x2="215" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="232" y1="135" x2="232" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  <line x1="249" y1="135" x2="249" y2="220" stroke="#aaaaaa" stroke-width="2.5"/>
  
  <!-- Lower Section - Coil Assembly -->
  <rect x="40" y="270" width="220" height="160" fill="#8a8a8a" stroke="#666666" stroke-width="2" rx="4"/>
  
  <!-- Copper Coil Fins (Front face visible) -->
  <g id="coils">
    <!-- Horizontal coil tubes/fins -->
    <line x1="50" y1="290" x2="250" y2="290" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="305" x2="250" y2="305" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="320" x2="250" y2="320" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="335" x2="250" y2="335" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="350" x2="250" y2="350" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="365" x2="250" y2="365" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="380" x2="250" y2="380" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    <line x1="50" y1="395" x2="250" y2="395" stroke="#a0826d" stroke-width="3" opacity="0.8"/>
    
    <!-- Vertical support lines -->
    <line x1="60" y1="285" x2="60" y2="405" stroke="#8b7355" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="285" x2="100" y2="405" stroke="#8b7355" stroke-width="1" opacity="0.5"/>
    <line x1="140" y1="285" x2="140" y2="405" stroke="#8b7355" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="285" x2="180" y2="405" stroke="#8b7355" stroke-width="1" opacity="0.5"/>
    <line x1="220" y1="285" x2="220" y2="405" stroke="#8b7355" stroke-width="1" opacity="0.5"/>
    <line x1="260" y1="285" x2="260" y2="405" stroke="#8b7355" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Connection Ports -->
  <g id="ports">
    <circle cx="80" cy="425" r="5" fill="#c0a060" stroke="#8b7355" stroke-width="1"/>
    <circle cx="150" cy="425" r="5" fill="#c0a060" stroke="#8b7355" stroke-width="1"/>
    <circle cx="220" cy="425" r="5" fill="#c0a060" stroke="#8b7355" stroke-width="1"/>
  </g>
  
  <!-- Condensate Drain (bottom corner) -->
  <circle cx="250" cy="430" r="4" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Base -->
  <rect x="40" y="445" width="220" height="10" fill="#888888" rx="2"/>
</svg>