<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#e6f2ff"/>
  
  <!-- Wall Background -->
  <rect x="0" y="0" width="400" height="300" fill="#eeeeee" opacity="0.3"/>
  
  <!-- Mounting Bracket (not visible, just foundation) -->
  <rect x="120" y="120" width="160" height="160" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Unit Body - Compact and Slim -->
  <rect x="130" y="80" width="140" height="180" fill="#a0a0a0" rx="8"/>
  
  <!-- Header Trim (Blue) -->
  <rect x="135" y="85" width="130" height="35" fill="#0099CC" rx="6"/>
  <text x="200" y="108" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Wall-Mounted</text>
  <text x="200" y="122" font-size="10" fill="white" text-anchor="middle" font-family="Arial">Air Handler</text>
  
  <!-- Main Housing -->
  <rect x="138" y="125" width="124" height="120" fill="#888888" rx="4"/>
  
  <!-- Air Inlet Grille -->
  <rect x="143" y="135" width="114" height="35" fill="#cccccc" stroke="#666666" stroke-width="1" rx="2"/>
  <!-- Grille Pattern -->
  <line x1="148" y1="140" x2="248" y2="140" stroke="#999999" stroke-width="0.5"/>
  <line x1="148" y1="145" x2="248" y2="145" stroke="#999999" stroke-width="0.5"/>
  <line x1="148" y1="150" x2="248" y2="150" stroke="#999999" stroke-width="0.5"/>
  <line x1="148" y1="155" x2="248" y2="155" stroke="#999999" stroke-width="0.5"/>
  <line x1="148" y1="160" x2="248" y2="160" stroke="#999999" stroke-width="0.5"/>
  
  <!-- Central Motor Section -->
  <circle cx="200" cy="180" r="25" fill="#666666" stroke="#444444" stroke-width="2"/>
  <circle cx="200" cy="180" r="18" fill="#0099CC"/>
  
  <!-- Motor Indicator -->
  <text x="200" y="185" font-size="16" fill="white" text-anchor="middle" text-anchor="middle">⚙️</text>
  
  <!-- Speed Control Buttons -->
  <g id="controls">
    <rect x="150" y="220" width="16" height="16" fill="#cccccc" stroke="#888888" stroke-width="1" rx="2"/>
    <text x="158" y="229" font-size="10" fill="#333333" text-anchor="middle" font-family="Arial">1</text>
    
    <rect x="175" y="220" width="16" height="16" fill="#cccccc" stroke="#888888" stroke-width="1" rx="2"/>
    <text x="183" y="229" font-size="10" fill="#333333" text-anchor="middle" font-family="Arial">2</text>
    
    <rect x="200" y="220" width="16" height="16" fill="#0099CC" stroke="#007aa3" stroke-width="1" rx="2"/>
    <text x="208" y="229" font-size="10" fill="white" text-anchor="middle" font-family="Arial">3</text>
    
    <rect x="225" y="220" width="16" height="16" fill="#cccccc" stroke="#888888" stroke-width="1" rx="2"/>
    <text x="233" y="229" font-size="10" fill="#333333" text-anchor="middle" font-family="Arial">4</text>
  </g>
  
  <!-- Air Outlet (Bottom) -->
  <rect x="143" y="245" width="114" height="18" fill="#b0b0b0" stroke="#888888" stroke-width="1" rx="2"/>
  <!-- Outlet Vents -->
  <line x1="155" y1="250" x2="155" y2="258" stroke="#888888" stroke-width="1"/>
  <line x1="170" y1="250" x2="170" y2="258" stroke="#888888" stroke-width="1"/>
  <line x1="185" y1="250" x2="185" y2="258" stroke="#888888" stroke-width="1"/>
  <line x1="200" y1="250" x2="200" y2="258" stroke="#888888" stroke-width="1"/>
  <line x1="215" y1="250" x2="215" y2="258" stroke="#888888" stroke-width="1"/>
  <line x1="230" y1="250" x2="230" y2="258" stroke="#888888" stroke-width="1"/>
  <line x1="245" y1="250" x2="245" y2="258" stroke="#888888" stroke-width="1"/>
</svg>