<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta Tags - Essential -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <!-- SEO Meta Tags -->
  <title>Sun Air | Premium Heating & Cooling Solutions</title>
  <meta name="description" content="Discover Sun Air's premium heating and cooling systems: heat pumps, air conditioners, furnaces, and air handlers. Efficient, reliable comfort for every season.">
  <meta name="keywords" content="HVAC, heating, cooling, heat pumps, air conditioning, furnaces">
  <meta name="author" content="Sun Air">
  <meta name="theme-color" content="#0052CC">
  
  <!-- Open Graph (Social Media) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sun Air | Heating & Cooling Solutions">
  <meta property="og:description" content="Premium HVAC systems for complete climate control.">
  <meta property="og:image" content="/images/og-image.png">
  <meta property="og:url" content="https://sunair.com">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sun Air | Heating & Cooling Solutions">
  <meta name="twitter:description" content="Premium HVAC systems for complete climate control.">
  <meta name="twitter:image" content="/images/twitter-image.png">
  
  <!-- Preconnect & DNS Prefetch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/responsive.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  
  <!-- CSS Variables for Theming -->
  <style>
    :root {
      --primary-color: #0052CC;
      --secondary-color: #FFC107;
      --text-dark: #1a1a1a;
      --text-light: #666666;
      --bg-light: #f9f9f9;
      --border-color: #e0e0e0;
      --transition: all 0.3s ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      color: var(--text-dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }
  </style>
  
  <!-- No-JS Fallback -->
  <noscript>
    <p>This site requires JavaScript to be enabled for optimal functionality.</p>
  </noscript>
</head>
<body>
  <!-- Your content goes here -->
</body>
</html>
